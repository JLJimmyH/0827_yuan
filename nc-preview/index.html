<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NC 預演台 — Fanuc 加工中心 G-code 預演／檢錯</title>
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/view2d.css">
  <link rel="stylesheet" href="css/view3d.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app" data-mview="view">

  <!-- ==================== 頂列工具列 ==================== -->
  <header class="app-bar">
    <div class="app-bar__title">NC 預演台</div>

    <!-- 手機版：開檔／存檔／Block skip 收在這顆鈕後面（桌機由 CSS 隱藏這顆鈕、選單常駐） -->
    <button type="button" class="nc-btn app-bar__more" id="btnBarMore" aria-expanded="false" title="開檔、存檔、Block skip 等設定">☰</button>

    <div class="app-bar__group">
      <button type="button" class="nc-btn" id="btnOpen" title="開啟本機的 NC 程式檔或刀具表 CSV（也可以直接把檔案拖進這個視窗）">開檔…</button>
      <input type="file" id="fileInput" class="app-hidden-file" aria-label="選擇 NC 程式檔">

      <label class="app-bar__label" for="selSample">範例</label>
      <select class="nc-select" id="selSample" title="載入內建的真實程式範例">
        <option value="">（選擇範例）</option>
      </select>
    </div>

    <div class="app-bar__group">
      <button type="button" class="nc-btn" id="btnSave" title="以原檔名下載目前編輯器內容">存檔</button>
      <button type="button" class="nc-btn" id="btnCopy" title="把整支程式複製到剪貼簿">複製</button>
    </div>

    <div class="app-bar__group">
      <label class="app-bar__label" for="selScenario">Block skip</label>
      <select class="nc-select" id="selScenario" title="切換 block skip（節首斜線）的預演情境">
        <option value="off">關：全部執行</option>
        <option value="on">開：跳過 / 節</option>
        <option value="multiIgnored">只跳過多斜線節</option>
      </select>
    </div>

    <div class="app-bar__spacer"></div>

    <!-- 第四軸橫幅留在頂列：它講的是「這張圖能不能信」，要貼著視圖。
         素材推估／刀具用預設值那兩條搬到下方狀態條的總覽與徽章。 -->
    <button type="button" class="nc-banner nc-banner-warn app-bar__banner nc-hidden" id="rotaryBanner"></button>

    <div class="app-bar__status" id="status" role="status" aria-live="polite">
      <span class="app-status__text" id="statusText">尚未載入程式</span>
      <span class="app-status__counts" id="statusCounts"></span>
      <span class="app-progress nc-hidden" id="progressWrap"><i class="app-progress__bar" id="progressBar"></i></span>
    </div>
  </header>

  <!-- ==================== 主體：左 Project（全高）｜右 視圖（上）＋狀態條（下） ==================== -->
  <main class="app-main" id="appMain">

      <!-- ---------- 左：Project（程式、素材、刀具表、刀庫、機台都在這裡改） ---------- -->
      <section class="app-pane app-left" id="appLeft">
        <div class="app-pane__head">
          <span class="app-pane__title">Project</span>
          <span class="app-pane__sub" id="fileLabel">（未載入）</span>
        </div>
        <div class="app-tabs app-tabs--project" role="tablist" aria-label="Project 子頁">
          <button type="button" class="app-tab is-on" data-ptab="program" role="tab">程式</button>
          <button type="button" class="app-tab" data-ptab="stock" role="tab" title="素材形狀、尺寸、原點位置、夾具（跟著這支程式存）">素材</button>
          <button type="button" class="app-tab" data-ptab="tools" role="tab" title="這支程式用到的刀：型式、直徑、D／H 補正（跟著這支程式存）">刀具表</button>
          <button type="button" class="app-tab" data-ptab="mag" role="tab" title="刀庫刀位配置（整台機共用，不跟著程式走）">刀庫</button>
          <button type="button" class="app-tab" data-ptab="machine" role="tab" title="第四軸裝夾、Block skip、機台參數、模擬格距">機台</button>
        </div>

        <div class="app-ptab app-ptab--program" data-ppanel="program">
          <div class="app-pane__body" id="editorHost"></div>
          <!-- 游標行的一行摘要：完整的模態狀態在下方「游標行」分頁，點這一行就切過去 -->
          <button type="button" class="app-mini-modal" id="miniModal" title="游標行執行後的模態摘要。點一下看完整的模態狀態。"></button>
        </div>
        <div class="app-ptab app-pane__body--scroll nc-hidden" data-ppanel="stock">
          <div class="app-ptab__note">跟著這支程式存。沒填的話用切削範圍推估，靠素材判斷的檢查只會給黃色警告。</div>
          <div id="stockHost"></div>
        </div>
        <div class="app-ptab app-pane__body--scroll nc-hidden" id="tabTools" data-ppanel="tools"></div>
        <div class="app-ptab app-pane__body--scroll nc-hidden" id="tabMag" data-ppanel="mag">
          <div class="app-ptab__note">整台機共用，換程式不會變。</div>
          <div id="magHost"></div>
        </div>
        <div class="app-ptab app-pane__body--scroll nc-hidden" data-ppanel="machine">
          <div class="app-ptab__note">整台機共用；「第四軸」那一組是這支程式的裝夾參數，跟著程式存。</div>
          <div id="settingsHost"></div>
        </div>
      </section>

      <div class="app-vsplit" id="colSplit" role="separator" aria-orientation="vertical" title="拖曳調整左右比例（雙擊回到一半一半）"></div>

      <!-- ---------- 右：視圖 ---------- -->
      <section class="app-right" id="appRight">

      <div class="app-pane app-pane--view">
        <div class="app-view-tools" id="viewTools">
          <div class="app-view-tools__row">
            <div class="app-seg" role="group" aria-label="視圖模式">
              <button type="button" class="app-seg__btn is-on" data-mode="top">俯視</button>
              <button type="button" class="app-seg__btn" data-mode="sectionX">剖面 X</button>
              <button type="button" class="app-seg__btn" data-mode="sectionY">剖面 Y</button>
              <button type="button" class="app-seg__btn" data-mode="3d" id="btnMode3d" title="3D 成品視圖（需要 WebGL）">3D</button>
              <button type="button" class="app-seg__btn" data-mode="unroll" id="btnModeUnroll" title="第四軸展開圖：把圓柱工件的表面攤平（橫軸＝軸向位置，縱軸＝角度）" disabled>展開圖</button>
            </div>

            <label class="app-slider" id="lblSection" title="剖面位置（工件座標）">
              <span class="app-slider__label">剖面</span>
              <input type="range" id="rngSection" min="-100" max="100" step="0.5" value="0" disabled>
              <span class="app-slider__value" id="secVal">—</span>
            </label>

            <label class="nc-check" id="lblSplit" title="左邊 2D、右邊 3D 並排。拉剖面滑桿時右邊會顯示現在是從哪裡切下去的。"><input type="checkbox" id="chkSplit" checked> 並排 3D</label>
            <label class="nc-check" id="lblClip" title="把 3D 切開一半，直接看斷面——和左邊那張剖面圖是同一刀。切掉哪一邊固定不變，不會自己換。"><input type="checkbox" id="chkClip" checked> 3D 剖切</label>
            <button type="button" class="nc-btn nc-btn-small nc-hidden" id="btnClipFlip" title="換一邊切。剖面拉到工件端面附近時，留下來的那塊會很薄，按這個換成留另一邊。">換邊</button>

            <button type="button" class="nc-btn nc-btn-small" id="btnFit" title="重設縮放，把整個工件放進畫面">全覽</button>

            <!-- 手機版：並排 3D／模擬到／顯示圖層／刀具這些「調好就不動」的選項收在這後面 -->
            <button type="button" class="nc-btn nc-btn-small app-view-tools__more" id="btnViewMore" aria-expanded="false" title="更多顯示選項（並排 3D、模擬到、顯示圖層、刀具）">選項</button>
          </div>

          <div class="app-view-tools__row app-view-tools__row--snapshot">
            <label class="app-slider app-slider--wide" title="只顯示模擬到第 N 把刀為止的成品">
              <span class="app-slider__label">模擬到</span>
              <input type="range" id="rngSnapshot" min="0" max="0" step="1" value="0" disabled>
              <span class="app-slider__value" id="snapVal">尚未模擬</span>
            </label>
          </div>

          <div class="app-view-tools__row app-view-tools__row--wrap">
            <span class="app-view-tools__label">顯示</span>
            <label class="nc-check"><input type="checkbox" id="chkRapid" checked> 快速 G0</label>
            <label class="nc-check"><input type="checkbox" id="chkFeed" checked> 切削</label>
            <label class="nc-check"><input type="checkbox" id="chkRef"> 回原點路徑</label>
            <label class="nc-check"><input type="checkbox" id="chkStock" checked> 素材</label>
            <!-- 廢料：切穿之後跟工件分開的料。這裡只管「畫不畫」，判定方式在左欄「素材」子頁調——設定跟顯示分開。
                 預設「標示」而不是「隱藏」：一料多件或判反的時候，隱藏會讓人看不到那塊料跑哪去了。 -->
            <label class="nc-check app-scrap" title="切穿之後跟工件分開的料。判定方式在左欄「素材」子頁的「廢料判定」調整。">廢料 <select class="nc-select" id="selScrap"><option value="off">照舊</option><option value="mark" selected>標示</option><option value="hide">隱藏</option></select></label>
            <label class="nc-check nc-hidden" id="lblRotary" title="工件分度轉動時，刀相對於工件掃過的軌跡。實際上刀沒有動、是工件在轉，所以預設不畫；要看分度會不會掃到刀時才打開。"><input type="checkbox" id="chkRotary"> 工件轉動軌跡</label>
          </div>

          <div class="app-view-tools__row app-view-tools__row--tools">
            <span class="app-view-tools__label app-view-tools__label--tools">刀具</span>
            <div class="app-tool-filter nc-view2d-legend" id="toolFilter"></div>
          </div>
        </div>

        <!-- 左 2D／右 3D 並排；中間那條可以拖 -->
        <div class="app-pane__body app-view-split" id="viewSplit">
          <div class="nc-view2d" id="viewHost"><canvas id="viewCanvas"></canvas></div>
          <div class="app-view-split__bar" id="viewSplitBar" role="separator" aria-orientation="vertical" title="拖曳調整左右比例（雙擊回到一半一半）"></div>
          <div class="nc-view3d nc-hidden" id="view3dHost"><canvas id="viewCanvas3d"></canvas></div>
        </div>

        <div class="app-view-foot">
          <span class="nc-view2d-scale">頂面 <i></i> 深處</span>
          <!-- 切穿的格子改畫棋盤（不再是一片深藍，那看起來像切很深）、廢料橘色——這兩種顏色跟色階條無關，所以另外給圖例 -->
          <span class="nc-view2d-key"><i class="air"></i>切穿／無料 <i class="scrap"></i>廢料</span>
          <span class="app-view-foot__hint app-view-foot__hint--mouse">滾輪縮放 · 拖曳平移 · 雙擊全覽 · 點路徑跳到該行（右側 3D：拖曳旋轉）</span>
          <span class="app-view-foot__hint app-view-foot__hint--touch">雙指縮放 · 單指平移 · 點路徑跳到該行（3D：單指旋轉）</span>
        </div>
      </div>

    <div class="app-hsplit" id="rowSplit" role="separator" aria-orientation="horizontal" title="拖曳調整狀態條高度（雙擊回到預設）"></div>

        <!-- ---------- 右下：狀態條（總覽、游標行、作業摘要、錯誤清單；右端是 Project 徽章） ---------- -->
      <section class="app-pane app-pane--status" id="appStatus">
        <div class="app-tabs" role="tablist" aria-label="狀態">
          <button type="button" class="app-tab is-on" data-tab="overview" role="tab" title="這支程式的素材、刀具、刀庫、機台設定現在長什麼樣；點一列跳到對應的 Project 子頁">總覽</button>
          <button type="button" class="app-tab" data-tab="modal" role="tab" title="游標所在行執行後的模態狀態">游標行 <span class="app-tab__sub" id="modalLineLabel"></span></button>
          <button type="button" class="app-tab" data-tab="ops" role="tab">作業摘要</button>
          <button type="button" class="app-tab" data-tab="diag" role="tab">錯誤清單 <span class="app-tab__badge nc-hidden" id="diagBadge"></span></button>
            <div class="app-chips" id="projectChips" aria-label="Project 狀態徽章"></div>
        </div>
        <div class="app-tab-body app-pane__body--scroll" id="tabOverview" data-panel="overview"></div>
        <div class="app-tab-body app-pane__body--scroll nc-hidden" id="modalHost" data-panel="modal"></div>
        <div class="app-tab-body app-pane__body--scroll nc-hidden" id="tabOps" data-panel="ops"></div>
        <div class="app-tab-body app-pane__body--scroll nc-hidden" id="tabDiag" data-panel="diag"></div>
      </section>

      </section>
  </main>

  <!-- ==================== 手機版底部導覽（桌機由 CSS 隱藏） ==================== -->
  <nav class="app-mnav" aria-label="主要區域切換">
    <button type="button" class="app-mnav__btn" data-mview="project">Project</button>
    <button type="button" class="app-mnav__btn is-on" data-mview="view">視圖</button>
    <button type="button" class="app-mnav__btn" data-mview="status">狀態 <span class="app-tab__badge nc-hidden" id="mnavDiagBadge"></span></button>
  </nav>

  <!-- 整頁拖放提示 -->
  <div class="app-drop" id="dropOverlay" aria-hidden="true"><div class="app-drop__box">放開以載入<br>NC 程式，或刀具表 CSV</div></div>
</div>

<!-- ==================== 依契約順序載入 ==================== -->
<script src="js/core/ns.js"></script>
<script src="js/core/tokenizer.js"></script>
<script src="js/core/interpreter.js"></script>
<script src="js/core/geometry.js"></script>
<script src="js/core/tools.js"></script>
<script src="js/core/simulation.js"></script>
<script src="js/core/rules.js"></script>
<script src="js/core/analyze.js"></script>
<script src="js/ui/editor.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/view2d.js"></script>
<script src="js/ui/view3d.js"></script>
<script src="js/ui/samples.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
